[package]
name = "dashboard"
version = "0.2.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
widgetbuilder = { path = "../widgetbuilder", features = ["wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
