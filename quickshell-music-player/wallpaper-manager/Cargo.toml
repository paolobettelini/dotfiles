[package]
name = "wallpaper-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Event-driven wallpaper policies for pocket-wallfx and the Quickshell music widget"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
